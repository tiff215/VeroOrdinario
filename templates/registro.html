{% extends "base.html" %}{% block title %}Crear cuenta · NutriTrack{% endblock %}
{% block auth %}
<h1>Crear cuenta</h1>
<form method="post" class="card grid">
  <div><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="100" autofocus></div>
  <div><label for="email">Correo</label><input id="email" name="email" type="email" required></div>
  <div><label for="password">Contraseña (mínimo 6 caracteres)</label><input id="password" name="password" type="password" minlength="6" required></div>
  <button class="btn">Crear cuenta</button>
  <span class="muted">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></span>
</form>
{% endblock %}
