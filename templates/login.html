{% extends "base.html" %}{% block title %}Iniciar sesión · NutriTrack{% endblock %}
{% block auth %}
<h1>NutriTrack</h1><p class="muted">Registra lo que comes y compáralo con tus objetivos.</p>
<form method="post" class="card grid">
  <div><label for="email">Correo</label><input id="email" name="email" type="email" required autofocus></div>
  <div><label for="password">Contraseña</label><input id="password" name="password" type="password" required></div>
  <button class="btn">Iniciar sesión</button>
  <span class="muted">¿Sin cuenta? <a href="{{ url_for('registro') }}">Crear cuenta</a></span>
</form>
{% endblock %}
